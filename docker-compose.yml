services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-epr_portal}
      POSTGRES_USER: ${POSTGRES_USER:-epr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epr_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-epr} -d ${POSTGRES_DB:-epr_portal}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

